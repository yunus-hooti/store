{% extends "parent/base.html" %}
{% block content %}

<style>
    /* کانتینر اصلی */
    .auth-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        padding: 20px;
        direction: rtl;
        font-family: 'Tahoma', 'Segoe UI', sans-serif;
    }

    /* کارت اصلی */
    .auth-card {
        background: #ffffff;
        width: 100%;
        max-width: 450px;
        padding: 45px 40px;
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        border: 1px solid #f0f0f0;
        text-align: center;
    }

    /* آیکون تایید نهایی (Success Icon) */
    .success-icon-container {
        width: 85px;
        height: 85px;
        background: #ecfdf5; /* سبز بسیار ملایم */
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 25px;
    }

    .success-icon {
        color: #10b981; /* سبز زنده */
        width: 45px;
        height: 45px;
    }

    /* تیترها */
    .auth-title {
        font-size: 24px;
        font-weight: 800;
        color: #1a1a1a;
        margin-bottom: 15px;
    }

    .auth-subtitle {
        font-size: 15px;
        color: #555555;
        line-height: 1.7;
        margin-bottom: 35px;
    }

    /* دکمه اصلی برای ورود به سایت */
    .btn-login {
        display: inline-block;
        width: 100%;
        background: #1a1a1a; /* رنگ مشکی/تیره برای ایجاد تضاد و حس قدرت */
        color: #ffffff;
        text-decoration: none;
        padding: 15px;
        border-radius: 14px;
        font-size: 16px;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    .btn-login:hover {
        background: #333333;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
    }

    /* لینک کمکی */
    .helper-link {
        display: block;
        margin-top: 20px;
        font-size: 13px;
        color: #888;
        text-decoration: none;
    }

    .helper-link:hover {
        color: #6c63ff;
    }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <!-- آیکون تایید نهایی -->
        <div class="success-icon-container">
            <svg class="success-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
            </svg>
        </div>

        <h2 class="auth-title">رمز عبور تغییر کرد!</h2>
        
        <p class="auth-subtitle">
            رمز عبور شما با موفقیت بازنشانی شد. اکنون می‌توانید با رمز عبور جدید خود وارد حساب کاربری‌تان شوید.
        </p>

        <!-- دکمه ورود -->
        <a href="{% url 'account:login' %}" class="btn-login">ورود به حساب کاربری</a>

        <!-- لینک کمکی برای اگر کاربر هنوز وارد نشده -->
        <a href="{% url 'account:login' %}" class="helper-link">اگر مشکلی دارید، دوباره تلاش کنید</a>
    </div>
</div>

{% endblock %}

{% extends "parent/base.html" %}
{% block content %}

<style>
    .auth-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        padding: 20px;
        direction: rtl;
        font-family: 'Tahoma', sans-serif;
    }

    .auth-card {
        background: #ffffff;
        width: 100%;
        max-width: 400px;
        padding: 50px 40px;
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        border: 1px solid #f0f0f0;
        text-align: center;
    }

    .success-icon {
        background: #e7f8ee;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 25px;
    }

    .auth-title {
        font-size: 22px;
        font-weight: 800;
        color: #1a1a1a;
        margin-bottom: 10px;
    }

    .auth-subtitle {
        font-size: 14px;
        color: #757575;
        line-height: 1.6;
    }

    .btn-modern {
        display: inline-block;
        width: 100%;
        box-sizing: border-box;
        background: #1a1a1a;
        color: #fff;
        text-decoration: none;
        padding: 14px;
        border-radius: 14px;
        font-size: 16px;
        font-weight: 600;
        margin-top: 30px;
        transition: all 0.3s ease;
    }

    .btn-modern:hover {
        background: #333;
        transform: translateY(-2px);
    }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="success-icon">
            <!-- SVG Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="#4BB543" viewBox="0 0 16 16">
              <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
            </svg>
        </div>
        
        <h2 class="auth-title">تغییر با موفقیت انجام شد</h2>
        <p class="auth-subtitle">
            رمز عبور شما به‌روزرسانی شد. از این پس با رمز جدید می‌توانید وارد شوید.
        </p>
        
        <a href="{% url 'account:profile' %}" class="btn-modern">بازگشت به پروفایل</a>
    </div>
</div>

{% endblock %}
